services:
  - type: web
    name: neoterik-pathways-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: neoterik-pathways-api
          property: host

  - type: web
    name: neoterik-pathways-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate:production
    startCommand: npm run db:migrate:production && npm run db:seed:super-admin && npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: neoterik-pathways-db
          property: connectionString
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: neoterik-pathways-web
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

databases:
  - name: neoterik-pathways-db
    databaseName: neoterik_pathways
    user: neoterik_pathways
    plan: basic-256mb
